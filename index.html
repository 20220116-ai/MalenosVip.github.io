<style>
/* Almacén de repuestos: cabecera blanca con logo, banda azul noche con el estado del día, contenido en tarjetas y gráficos */
:root{
  --noche:#061848; --marino:#132571; --rey:#0959C9; --cielo:#1BACE5; --hielo:#EFF3F9;
  --tinta-marca:#132571; --cab:#FFFFFF; --banda:#061848; --banda-mute:#B3C6E8;
  --paper:#F2F5FA; --card:#FFFFFF; --line:#D3DCE8; --line-2:#E6ECF4; --ink:#0F1B3D; --ink-2:#3A4766; --mute:#58658A;
  --go:#17794A; --go-bg:#DDF2E6; --warn:#8A5D00; --warn-dot:#E0A100; --warn-bg:#FFF2CC;
  --stop:#B42318; --stop-bg:#FDE3E0; --info:#0959C9; --info-bg:#E3EEFC; --focus:#0959C9; --activo:#132571;
  --s1:#0959C9; --s2:#eb6834; --s3:#1baf7a; --abcA:#0B3B8C; --abcB:#2a78d6; --abcC:#86b6ef;
  --grid:#E6ECF4; --eje:#C7D1DD; --critico:#d03b3b;
  --shadow:0 1px 2px rgba(6,24,72,.07);
  --f-titulo:"Montserrat","Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tinta-marca:#E7EDF9; --cab:#0D1738; --banda:#050F2E; --rey:#2F7BE6; --hielo:#121F48;
    --paper:#0A1230; --card:#111C40; --line:#27366C; --line-2:#1B2954; --ink:#E7EDF9; --ink-2:#C3CCE0; --mute:#9DAACB;
    --go:#5BC98D; --go-bg:#143323; --warn:#F2C55C; --warn-dot:#E8B030; --warn-bg:#3A2C0C;
    --stop:#FF8B80; --stop-bg:#3E1B1B; --info:#6FA8F5; --info-bg:#16295A; --focus:#6FA8F5; --activo:#2F7BE6;
    --s1:#3D8BF0; --s2:#d95926; --s3:#199e70; --abcA:#cde2fb; --abcB:#5598e7; --abcC:#1c5cab;
    --grid:#1B2954; --eje:#2D3D73; --critico:#e66767; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tinta-marca:#E7EDF9; --cab:#0D1738; --banda:#050F2E; --rey:#2F7BE6; --hielo:#121F48;
  --paper:#0A1230; --card:#111C40; --line:#27366C; --line-2:#1B2954; --ink:#E7EDF9; --ink-2:#C3CCE0; --mute:#9DAACB;
  --go:#5BC98D; --go-bg:#143323; --warn:#F2C55C; --warn-dot:#E8B030; --warn-bg:#3A2C0C;
  --stop:#FF8B80; --stop-bg:#3E1B1B; --info:#6FA8F5; --info-bg:#16295A; --focus:#6FA8F5; --activo:#2F7BE6;
  --s1:#3D8BF0; --s2:#d95926; --s3:#199e70; --abcA:#cde2fb; --abcB:#5598e7; --abcC:#1c5cab;
  --grid:#1B2954; --eje:#2D3D73; --critico:#e66767; --shadow:none; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num,.tabla td,.tabla th,.eje-t{font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:13px}

/* Cabecera */
.cab{background:var(--cab)}
.cab-in{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding-block:14px}
.logo{display:block;height:96px;width:auto;background:#fff;border-radius:10px}
.titulo{border-left:1px solid var(--line);padding-left:22px;min-width:0}
.sistema{font-size:14px;font-weight:600;color:var(--rey)}
.titulo h1{font-family:var(--f-titulo);font-weight:800;font-style:italic;font-size:clamp(28px,4vw,42px);line-height:1.08;color:var(--tinta-marca);letter-spacing:-.01em;margin-top:2px}
.fecha{margin-top:4px;color:var(--mute);font-size:14.5px}
.hero{text-align:right;max-width:240px}
.hero b{display:block;font-family:var(--f-titulo);font-weight:800;font-size:clamp(32px,4.6vw,48px);line-height:1;color:var(--tinta-marca)}
.hero span{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.franja{display:grid;grid-template-columns:7fr 3fr;height:5px}
.franja i:nth-child(1){background:#0959C9} .franja i:nth-child(2){background:#1BACE5}
.resumen{background:var(--banda);color:#fff}
.estado-dia{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.estado-dia > div{padding:12px 16px 13px 0}
.estado-dia > div + div{border-left:1px solid rgba(255,255,255,.14);padding-left:16px}
.estado-dia h2{font-size:13px;font-weight:600;color:var(--banda-mute)}
.estado-dia p{font-size:15px;margin-top:3px}
.estado-dia b{font-family:var(--f-titulo);font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 1px 0;vertical-align:middle}
.d-ok{background:#3DBE73}.d-pedir{background:#F2B33D}.d-quiebre{background:#F0645A}.d-transito{background:#7FB2F5}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13.5px;border-bottom:1px solid var(--line)}
.demo .wrap{padding-block:7px 6px}

/* Pestañas y acciones */
.tabs-bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-bar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 11px 9px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--tinta-marca);border-bottom-color:var(--rey)}
.tab .n{font-weight:400;color:var(--mute);margin-left:4px}
.acciones{display:flex;gap:6px;padding:6px 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 11px 4px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn-pri{background:var(--rey);border-color:var(--rey);color:#fff}
.btn-pri:hover{background:var(--marino);border-color:var(--marino)}
.btn-sm{padding:4px 9px 2px;font-size:13px}
.btn-link{border:0;background:none;color:var(--info);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
.corto{display:none}

main{padding-block:24px 48px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.intro h2{font-family:var(--f-titulo);font-size:22px;font-weight:800;color:var(--tinta-marca)}
.intro p{color:var(--mute);max-width:72ch;margin-top:4px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 3px;font-size:14px;font-weight:600;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--activo);border-color:var(--activo);color:#fff}
.buscar,.sel{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px 5px}
.buscar{margin-left:auto;min-width:220px;flex:0 1 280px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow);min-width:0}

.dos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.dos.par{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:960px){.dos,.dos.par{grid-template-columns:minmax(0,1fr)}}
.pila{display:flex;flex-direction:column;gap:18px}
.vacio{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--mute);text-align:center}

/* Pills */
.pill{display:inline-block;border-radius:4px;padding:2px 7px 0;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--go-bg);color:var(--go)} .p-obs{background:var(--warn-bg);color:var(--warn)}
.p-bloq{background:var(--stop-bg);color:var(--stop)} .p-info{background:var(--info-bg);color:var(--info)} .p-gris{background:var(--line-2);color:var(--mute)}
.clase{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:800;font-size:12.5px;color:#fff;padding-top:1px}
.clase.A{background:#0B3B8C} .clase.B{background:#2a78d6} .clase.C{background:#86b6ef;color:#0B1F4A}

/* Tarjetas de repuesto */
.grid-rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rep{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--go);background:var(--card);border-radius:8px;padding:12px 13px 12px;box-shadow:var(--shadow);min-width:0}
.rep.e-PEDIR{border-left-color:var(--warn-dot)} .rep.e-QUIEBRE{border-left-color:var(--stop)} .rep.e-TRANSITO{border-left-color:#7FB2F5}
.rep-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.rep-top button{text-align:left;border:0;background:none;padding:0;min-width:0}
.rep-n{font-size:12.5px;color:var(--mute)}
.rep-nom{font-weight:800;font-size:15.5px;line-height:1.25}
.estado{font-weight:800;font-size:14.5px}
.e-OK .estado{color:var(--go)} .e-PEDIR .estado{color:var(--warn)} .e-QUIEBRE .estado{color:var(--stop)} .e-TRANSITO .estado{color:var(--info)}

.medidor .disp{position:absolute;left:0;top:9px;height:10px;border-radius:5px 0 0 5px;background:var(--s1)}
.medidor .res{position:absolute;top:9px;height:10px;background:repeating-linear-gradient(45deg,var(--s1) 0 2px,transparent 2px 5px);opacity:.7}
.medidor .tra{position:absolute;top:9px;height:10px;border:1.5px dashed var(--s1);border-left:0;border-radius:0 5px 5px 0}
.medidor .marca{position:absolute;top:4px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.medidor .marca.ss{background:var(--mute)}
.medidor .marca span{position:absolute;top:21px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--mute);white-space:nowrap}
.cifras-rep{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.cifras-rep div{font-size:12px;color:var(--mute)}
.cifras-rep b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.rep .acc{display:flex;gap:6px;flex-wrap:wrap}
.leyenda-med{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:-8px 0 14px}
.leyenda-med i{display:inline-block;width:18px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* Tablas */
.t-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla th{font-size:12.5px;font-weight:600;color:var(--mute);text-align:left;padding:9px 10px 7px;border-bottom:1px solid var(--line);background:var(--hielo);white-space:nowrap;position:sticky;top:0}
.tabla td{padding:8px 10px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tabla td.r,.tabla th.r{text-align:right;white-space:nowrap}
.tabla tr.sel td{background:var(--info-bg)}
.tabla tbody tr[data-act]{cursor:pointer}
.tabla tbody tr[data-act]:hover td{background:var(--hielo)}
.tabla tfoot td{font-weight:800;border-top:1px solid var(--line);border-bottom:0}
.tabla tr.f-PEDIR td{background:var(--warn-bg)} .tabla tr.f-QUIEBRE td{background:var(--stop-bg)}
.alto{max-height:520px;overflow:auto}

.graf svg{display:block;width:100%;height:auto;overflow:visible}

.eje-t{font-size:11px;fill:var(--mute)}
.lbl{font-size:12px;fill:var(--ink-2);font-weight:600}
.lbl-m{font-size:11.5px;fill:var(--mute)}
.lbl,.lbl-m{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.ley{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;line-height:1.4;color:var(--ink-2);margin:2px 0 8px}

.ley .sq{display:inline-block;width:11px;height:11px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 10px 6px;font-size:12.5px;line-height:1.4;z-index:3;min-width:150px;max-width:260px;box-shadow:0 4px 16px rgba(6,24,72,.25)}
.tip b{font-weight:800}
.calc{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.calc dt{color:var(--mute)}
.calc dd{margin:0;font-variant-numeric:tabular-nums}
.calc dd b{font-family:var(--f-titulo);font-size:16px;color:var(--tinta-marca)}
.selector{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.selector select{max-width:100%}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ctrl input[type=number]{width:96px;border:1px solid var(--line);border-radius:6px;padding:6px 8px 4px;background:var(--card)}
.ctrl input[type=range]{width:200px;accent-color:var(--rey)}

/* Cifras e indicadores */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cifras div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--rey);border-radius:8px;padding:12px 14px 10px}
.cifras b{display:block;font-family:var(--f-titulo);font-size:22px;font-weight:800;color:var(--tinta-marca)}
.cifras span{font-size:13px;color:var(--mute)}
.escala{position:relative;height:86px;margin:0 8px}
.escala .eje{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
.escala .tick{position:absolute;top:66px;font-size:11px;color:var(--mute);transform:translateX(-50%)}
.escala .tick::before{content:"";position:absolute;left:50%;top:-30px;width:1px;height:6px;background:var(--line)}
.marca-k{position:absolute;top:27px;width:0;display:flex;flex-direction:column;align-items:center}

.cont .barra{height:8px;border-radius:4px;background:var(--line-2);margin-top:8px;overflow:hidden}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

<script>
"use strict";
/* ==LOGICA== */
let D = JSON.parse(document.getElementById("datos").textContent);
let REP, PORN, KEY, R, S = null, P;
let vista = "inventario", sel = 1, abierto = null;
const filtro = {inv: "todos", q: "", kx: "todos"};
const TIPOS = ["INICIAL", "RECEPCION", "CONTEO", "RESERVA", "SALIDA", "PEDIDO"];
const PRIO = Object.fromEntries(TIPOS.map((t, i) => [t, i]));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const n0 = (x) => x == null || isNaN(x) ? "—" : Math.round(x).toLocaleString("en-US");
const n1 = (x) => x == null || isNaN(x) ? "—" : x.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const n2 = (x) => x == null || isNaN(x) ? "—" : x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const n3 = (x) => x == null || isNaN(x) ? "—" : x.toLocaleString("en-US", {minimumFractionDigits: 3, maximumFractionDigits: 3});
const pct = (x, d = 1) => x == null || isNaN(x) ? "—" : x.toFixed(d) + " %";
const sol = (x) => "S/ " + n0(x);
const arriba = (x) => Math.ceil(Math.round(x * 1e9) / 1e9);
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const MES_C = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const aFecha = (s) => new Date(s + "T12:00:00");
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const masDias = (s, k) => { const d = aFecha(s); d.setDate(d.getDate() + k); return iso(d); };
const difDias = (a, b) => Math.round((aFecha(a) - aFecha(b)) / 86400000);
const fCorta = (s) => { const d = aFecha(s); return d.getDate() + " " + MES_C[d.getMonth()]; };
const fTxt = (s) => s ? s.split("-").reverse().join("/") : "—";
const capital = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const ESTADO = {OK: ["Stock suficiente", "p-ok"], PEDIR: ["Pedir ahora", "p-obs"], TRANSITO: ["Pedido en camino", "p-info"], QUIEBRE: ["Quiebre de stock", "p-bloq"]};

function preparar() {
  P = D.parametros;
  REP = [...D.repuestos].sort((a, b) => a.n - b.n);
  PORN = Object.fromEntries(REP.map((r) => [r.n, r]));
  KEY = "reorden:" + D.meta.fecha_corte + (D.meta.demo ? ":demo" : "");
  R = cargar();
  if (!PORN[sel]) sel = REP[0].n;
}
function vacios() { return {movimientos: [], costo_pedido: P.costo_pedido}; }
function cargar() {
  try { const g = localStorage.getItem(KEY); if (g) return Object.assign(vacios(), JSON.parse(g)); } catch (e) { /* en memoria */ }
  return vacios();
}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) { /* en memoria */ } }

/* ---------- Robot 3: kárdex (mismas reglas que la clase Kardex de Python) ---------- */
class Kardex {
  constructor(rep) { this.rep = rep; this.saldo = 0; this.reservado = 0; this.transito = 0; this.pendientes = []; this.filas = []; this.reqs = []; this.ocs = {}; }
  get posicion() { return this.saldo - this.reservado + this.transito; }
  fila(m, ent, sal, doc, alerta) {
    const pos = this.posicion;
    this.filas.push({fecha: m.fecha, n: this.rep.n, doc: doc || m.doc || "", tipo: m.tipo, entradas: ent || 0, salidas: sal || 0, saldo: this.saldo,
      reservado: this.reservado, transito: this.transito, posicion: pos, alerta: alerta || (pos <= this.rep.ROP ? "PEDIR" : "OK"), responsable: m.responsable || "Almacenero", id: m.id});
  }
  aplicar(m) {
    const t = m.tipo, q = parseInt(m.cantidad, 10) || 0, f = m.fecha;
    if (t === "INICIAL") { this.saldo += q; this.fila(m, q); }
    else if (t === "PEDIDO") { this.transito += q; this.ocs[m.oc] = {oc: m.oc, n: this.rep.n, fecha: f, cantidad: q, esperada: m.esperada || null, recibida: null}; this.fila(m); }
    else if (t === "RECEPCION") {
      this.saldo += q; this.transito = Math.max(0, this.transito - q);
      if (m.oc && this.ocs[m.oc]) this.ocs[m.oc].recibida = f;
      this.fila(m, q);
      for (const p of [...this.pendientes]) {
        const toma = Math.min(p.faltante_abierto, this.saldo);
        if (toma <= 0) break;
        this.saldo -= toma; p.faltante_abierto -= toma;
        this.fila(m, 0, toma, "Atención pendiente " + p.doc);
        if (p.faltante_abierto === 0) { p.atendido_el = f; this.pendientes.splice(this.pendientes.indexOf(p), 1); }
      }
    } else if (t === "RESERVA") { this.reservado += q; this.fila(m); }
    else if (t === "SALIDA") {
      if (m.de_reserva) this.reservado = Math.max(0, this.reservado - q);
      const disponible = Math.max(0, this.saldo - this.reservado), atendido = Math.min(q, disponible), faltante = q - atendido;
      this.saldo -= atendido;
      const req = {fecha: f, n: this.rep.n, doc: m.doc || "", pedido: q, atendido, faltante, faltante_abierto: faltante, atendido_el: faltante ? null : f};
      this.reqs.push(req);
      if (faltante) this.pendientes.push(req);
      this.fila(m, 0, atendido, null, faltante ? "QUIEBRE" : null);
    } else if (t === "CONTEO") {
      const dif = q - this.saldo; this.saldo = q;
      this.fila(m, Math.max(dif, 0), Math.max(-dif, 0), m.doc || "Conteo físico");
    }
  }
}
function movimientos() { return D.movimientos.concat(R.movimientos); }
function ordenar(movs) { return movs.map((m, i) => [m, i]).sort((a, b) => a[0].fecha < b[0].fecha ? -1 : a[0].fecha > b[0].fecha ? 1 : (PRIO[a[0].tipo] - PRIO[b[0].tipo]) || (a[1] - b[1])).map((x) => x[0]); }
function procesar() {
  const kx = Object.fromEntries(REP.map((r) => [r.n, new Kardex(r)]));
  const serie = Object.fromEntries(REP.map((r) => [r.n, []]));
  const movs = ordenar(movimientos());
  const ultima = movs.length ? movs[movs.length - 1].fecha : D.meta.fecha_corte;
  const fin = ultima > D.meta.fecha_corte ? ultima : D.meta.fecha_corte;
  let i = 0, dia = D.meta.inicio;
  while (dia <= fin) {
    while (i < movs.length && movs[i].fecha <= dia) { if (kx[movs[i].n]) kx[movs[i].n].aplicar(movs[i]); i++; }
    for (const r of REP) { const k = kx[r.n]; serie[r.n].push([dia, k.saldo, k.posicion, k.reservado, k.transito]); }
    dia = masDias(dia, 1);
  }
  return {kx, serie, fin};
}
/* ---------- Robot 4: indicadores (mismas reglas que indicadores() de Python) ---------- */
function indicadores(kx, serie, corte, mes) {
  let req = 0, comp = 0, uP = 0, uA = 0, quie = 0, ped = 0, dias = 0, valor = 0;
  const por = {};
  for (const r of REP) {
    const k = kx[r.n], rs = k.reqs.filter((x) => !mes || x.fecha.slice(0, 7) === mes);
    for (const x of rs) if (x.faltante) dias += Math.max(0, difDias(x.atendido_el || corte, x.fecha));
    const pd = Object.values(k.ocs).filter((o) => !mes || o.fecha.slice(0, 7) === mes);
    const se = serie[r.n].filter((s) => !mes || s[0].slice(0, 7) === mes);
    const prom = se.length ? se.reduce((a, s) => a + s[1], 0) / se.length : 0;
    const c = rs.filter((x) => !x.faltante).length;
    por[r.n] = {requerimientos: rs.length, completos: c, fill_rate: rs.length ? 100 * c / rs.length : null, quiebres: rs.filter((x) => x.faltante).length,
      pedidos: pd.length, stock_promedio: prom, consumo: rs.reduce((a, x) => a + x.pedido, 0)};
    req += rs.length; comp += c; uP += rs.reduce((a, x) => a + x.pedido, 0); uA += rs.reduce((a, x) => a + x.atendido, 0);
    quie += por[r.n].quiebres; ped += pd.length; valor += prom * r.precio;
  }
  return {requerimientos: req, completos: comp, disponibilidad: req ? 100 * comp / req : null, fill_rate_unidades: uP ? 100 * uA / uP : null,
    quiebres: quie, dias_bus_detenido: dias, pedidos: ped, inv_prom_val: valor, costo_mantener_anual: valor * P.tasa_mantener, por_repuesto: por};
}
/* ---------- Robot 2: EOQ (mismas fórmulas que eoq() y costo_total() de Python) ---------- */
function eoqDe(r, Sp) {

function graficoEOQ(cont, r, Sp) {

  const pts = []; for (let i = 0; i <= 160; i++) { const q = Math.max(0.2, qmax * i / 160); pts.push(q); }

  svg += `<text class="eje-t" x="${m.l + iw}" y="${H - 2}" text-anchor="end">tamaño del lote Q (und)</text><text class="eje-t" x="${m.l - 50}" y="12">costo en S/ al año</text>`;
  svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--eje)"/><g clip-path="url(#clip-eoq)">`;

  const ends = [[fT, "Costo total", "var(--s1)"], [fP, "Costo de pedir", "var(--s2)"], [fH, "Costo de mantener", "var(--s3)"]].map(([f, t]) => [Y(f(qmax)), t]).sort((a, b) => a[0] - b[0]);
  let prev = -99; for (const [y0, t] of ends) { let y = Math.max(m.t + 8, Math.min(m.t + ih, y0 + 4)); if (y - prev < 14) y = prev + 14; prev = y; svg += `<text class="lbl" x="${m.l + iw + 8}" y="${y}">${t}</text>`; }
  const marc = (q, t, lado, dy) => { const x = X(q), y = Y(fT(q)); return `<line x1="${x}" x2="${x}" y1="${y}" y2="${Y(0)}" stroke="var(--ink-2)" stroke-dasharray="4 4"/><circle cx="${x}" cy="${y}" r="5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/><text class="lbl" x="${lado === "end" ? x - 8 : x + 8}" y="${y + dy}" text-anchor="${lado}">${t}</text>`; };
  const igual = e.und === r.Q, eoqIzq = e.und <= r.Q;
  if (igual) svg += marc(r.Q, `EOQ = Q tesis = ${r.Q} und: ${sol(e.costoQ)}`, X(r.Q) > m.l + iw * 0.6 ? "end" : "start", -10);

function correoHoy() {

    s += `<path d="M${cx} ${cy - 22}L${cx + 22} ${cy}L${cx} ${cy + 22}L${cx - 22} ${cy}z" fill="${amber}" fill-opacity=".35" stroke="${amber}" stroke-width="2"/>${t ? `<text x="${cx}" y="${cy - 30}" font-size="12" text-anchor="middle" fill="${ink}">${t}</text>` : ""}`;
  return s + `</g></svg>`;
}
function vProceso() {
  const t = S.total, pedidos = S.ocs.length, rec = S.ocs.filter((o) => o.recibida).length, cambios = S.recalculo.filter((f) => f.cambia).length;
  const mv = movimientos(), cuenta = (tp) => mv.filter((m) => m.tipo === tp).length;
  const pasos = [
    ["Clasificación ABC de los repuestos críticos", "Robot 1 · Equipo de investigación", true, `${D.resumen_abc.map((f) => `clase ${f.clase}: ${f.items} ítems (${pct(100 * f.pct_valor)})`).join(", ")}`],
    ["Recopilación de datos por repuesto", "Equipo de investigación", false, `${REP.length} repuestos con demanda anual, precio y lead time`],
    ["Cálculo de la demanda diaria d = D/360", "Robot 2", true, `de ${n3(Math.min(...REP.map((r) => r.d)))} a ${n3(Math.max(...REP.map((r) => r.d)))} und/día`],
    ["Nivel de servicio y stock de seguridad", "Robot 2", true, `95 % → z = ${n3(P.z)}; inversión en SS ${sol(REP.reduce((a, r) => a + r.inversion_SS, 0))}`],
    ["Punto de reorden y lote de pedido", "Robot 2 · Jefe de Logística aprueba", true, D.meta.tabla_2_16_ok ? "SS, ROP, Q y stock máximo coinciden con la Tabla 2.16" : "parámetros calculados"],
    ["Organización del almacén y control visual", "Robot 3 · Almacenero", true, `${D.etiquetas.length} etiquetas, Kanban en ${REP.filter((r) => r.clase === "A").length} ítems clase A, ${cuenta("SALIDA")} consumos y ${cuenta("RESERVA")} reservas en el kárdex`],
    ["Coordinación con proveedores y con el PdM/CBM", "Compras · Jefe de Mantenimiento", false, `proveedor alterno para ${D.alternos.length} ítems con LT ≥ ${P.lt_proveedor_alterno} días; ${pedidos} pedidos, ${rec} recibidos`],
    ["Seguimiento y actualización", "Robot 4 · Jefe de Logística", true, `disponibilidad ${pct(t.disponibilidad)}, ${t.quiebres} quiebres; ${cambios} repuestos con parámetros nuevos al recalcular`]];
  const li = (p) => `<li class="${p[2] ? "robot" : ""}"><strong>${esc(p[0])}</strong><span class="quien">${esc(p[1])}</span><span class="hoy">${esc(p[3])}</span></li>`;
  const robots = [["Robot 1", "Clasificación ABC y Kraljic", "Paso 1 y 7", "Ordena por valor anual, asigna clase A/B/C y el cuadrante de compra por sistema"],
    ["Robot 2", "Parámetros de inventario", "Pasos 3 a 5", "Calcula d, SS, ROP, Q y stock máximo; compara el lote con el EOQ"],
    ["Robot 3", "Kárdex y alerta de reorden", "Pasos 6 y 7", "Actualiza la posición con cada movimiento, alerta PEDIR, arma la orden de compra y aparta las reservas del PdM"],
    ["Robot 4", "Seguimiento", "Paso 8", "Mide disponibilidad, quiebres y días de bus detenido cada mes y recalcula los parámetros cada trimestre"]];
  $("#vista").innerHTML = `<div class="intro"><div><h2>Sistema de punto de reorden con procesos robotizados</h2><p>El script de Python recorre el diagrama Bizagi de las Figuras 2.12 y 2.13 y ejecuta los cuatro robots. Este aplicativo usa las mismas reglas para el kárdex y los indicadores.</p></div></div>
  <div class="bizagi">${svgBizagi()}</div>
  <div class="dos par" style="margin-top:18px"><div class="panel"><h3>Pasos de la Tabla 2.3</h3><p class="sub">Círculo celeste: lo hace un robot.</p><ol class="pasos">${pasos.map(li).join("")}</ol></div>
  <div class="pila"><div class="panel"><h3>Robots</h3><div class="t-scroll"><table class="tabla"><thead><tr><th>Robot</th><th>Tarea</th><th>Paso</th><th>Qué hace</th></tr></thead><tbody>${robots.map((r) => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td style="min-width:220px">${r[3]}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h3>Recorrido del último proceso</h3><p class="sub">Bitácora del script de Python.</p><ol class="pasos" style="counter-reset:paso">${D.bitacora.filter((b) => b.carril !== "Evento").map((b) => `<li><strong>${esc(b.tarea)}</strong><span class="quien">${esc(b.carril)}</span><span class="hoy">${esc((b.detalle || "").split("\n")[0])}</span></li>`).join("")}</ol></div></div></div>`;
}

/* ---------- Panel del repuesto ---------- */
function abrir(n, refresco) {
  abierto = +n; const r = PORN[abierto], k = S.kx[r.n], e = S.estados[r.n], ev = eoqDe(r, R.costo_pedido);
  $("#dr-cab").innerHTML = `<p class="sub">N° ${r.n}, ${esc(r.sistema)}, clase ${r.clase}</p><h2 id="dr-titulo">${esc(r.nombre)}</h2>`;
  const abiertas = Object.values(k.ocs).filter((o) => !o.recibida);
  let html = `<div class="resultado r-${e}"><b>${ESTADO[e][0]}</b><span>Saldo ${k.saldo} und, reservado ${k.reservado}, en camino ${k.transito}: posición ${k.posicion} frente a ROP ${r.ROP}.</span><div class="acc" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${accionRapida(r)}</div></div>
  <section class="panel"><h3>Saldo, posición y punto de reorden</h3><div id="dr-sierra"></div></section>`;
  if (r.clase === "A") {
    const c1 = Math.max(0, k.saldo - r.ROP), c2 = Math.min(r.ROP, k.saldo);
    html += `<section class="panel"><h3>Kanban de dos contenedores</h3><p class="sub">Cada contenedor guarda ${r.ROP} und (el ROP). Cuando se vacía el primero, su tarjeta dispara el pedido de ${r.Q} und.</p><div class="kanban">
      <div class="cont ${c1 === 0 ? "vacio-k" : ""}"><b>Contenedor 1</b><span class="sub">${c1 === 0 ? "Vacío: tarjeta enviada a compras" : c1 + " und en uso"}</span><div class="barra"><i style="width:${Math.min(100, c1 / Math.max(1, r.Smax - r.ROP) * 100)}%"></i></div></div>
      <div class="cont"><b>Contenedor 2</b><span class="sub">${c2} de ${r.ROP} und de reserva</span><div class="barra"><i style="width:${c2 / r.ROP * 100}%"></i></div></div></div></section>`;
  }
  html += `<section class="panel"><h3>Registrar un movimiento</h3><p class="sub">Se agrega al kárdex y el Robot 3 recalcula la posición y la alerta.</p><form class="form" id="f-mov">
    <label>Tipo<select id="m-tipo" name="tipo"><option value="SALIDA">Consumo por orden de trabajo</option><option value="RESERVA">Reserva por alerta amarilla del PdM</option><option value="SALIDA_RES">Consumo de una reserva del PdM</option><option value="RECEPCION">Recepción de pedido</option><option value="PEDIDO">Emitir pedido</option><option value="CONTEO">Conteo físico (saldo contado)</option></select></label>
    <label>Cantidad (und)<input id="m-cant" name="cantidad" type="number" inputmode="numeric" min="0" step="1" value="1" required></label>
    <label>Fecha<input id="m-fecha" name="fecha" type="date" value="${S.fin}" required></label>
    <label>Documento<input id="m-doc" name="doc" type="text" placeholder="OT-0321 bus 14"></label>
    <label class="ancho" id="m-oc-l" hidden>Orden de compra<select id="m-oc" name="oc">${abiertas.map((o) => `<option value="${o.oc}">${o.oc}: ${o.cantidad} und</option>`).join("")}</select></label>
    <div class="ancho" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-pri" type="submit">Registrar en el kárdex</button>${R.movimientos.some((m) => m.n === r.n) ? `<button class="btn" type="button" data-act="deshacer" data-id="${r.n}">Deshacer el último registro</button>` : ""}</div></form></section>
  <section class="panel"><h3>Parámetros</h3>${calculoRop(r)}<p class="sub" style="margin-top:8px">Con S = S/ ${n0(R.costo_pedido)} por pedido, el EOQ sería ${ev.und} und (costo anual ${sol(ev.costoEOQ)} frente a ${sol(ev.costoQ)} con Q = ${r.Q}).${r.LT >= P.lt_proveedor_alterno ? " Lead time largo: tener proveedor alterno homologado." : ""}</p></section>
  <section class="panel"><h3>Kárdex</h3>${tablaKardex([...k.filas].reverse().slice(0, 40), false)}</section>`;
  $("#dr-body").innerHTML = html;
  graficoSierra($("#dr-sierra"), r, 240);
  const dr = $("#drawer");
  if (dr.hidden) { dr.hidden = false; $("#velo").hidden = false; document.body.style.overflow = "hidden"; $("#dr-cerrar").focus(); }
  ajustarForm();
}
function cerrar() {
  const prev = abierto; abierto = null; $("#drawer").hidden = true; $("#velo").hidden = true; document.body.style.overflow = "";
  const el = document.querySelector(`[data-act="rep"][data-id="${prev}"]`); if (el) el.focus();
}
function ajustarForm() {
  const t = $("#m-tipo"); if (!t) return;
  const r = PORN[abierto], abiertas = Object.values(S.kx[r.n].ocs).filter((o) => !o.recibida);
  $("#m-oc-l").hidden = t.value !== "RECEPCION";
  if (t.value === "PEDIDO") $("#m-cant").value = r.Q;
  if (t.value === "RECEPCION" && abiertas.length) $("#m-cant").value = abiertas[0].cantidad;
  if (t.value === "CONTEO") $("#m-cant").value = S.kx[r.n].saldo;
}
function agregar(m) {
  const id = "U" + String(R.movimientos.length + 1).padStart(5, "0");
  R.movimientos.push({id, responsable: "Almacenero", ...m}); guardar(); render();
}
function pedir(n, fecha) {
  const r = PORN[n], oc = siguienteOC(), f = fecha || S.fin;
  agregar({fecha: f, n: r.n, tipo: "PEDIDO", cantidad: r.Q, doc: `${oc} pedido emitido (Q = ${r.Q})`, oc, esperada: masDias(f, r.LT), responsable: "Robot 3 / Compras"});
  aviso(`${oc}: ${r.Q} und de ${r.nombre}, llegada esperada ${fTxt(masDias(f, r.LT))}`);
}
function recibir(oc, n, fecha) {
  const r = PORN[n], o = S.kx[n].ocs[oc]; if (!o) return;
  agregar({fecha: fecha || S.fin, n: +n, tipo: "RECEPCION", cantidad: o.cantidad, doc: `Recepción ${oc}`, oc});
  aviso(`Recepción ${oc}: +${o.cantidad} und de ${r.nombre}`);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (e.target.id === "velo") cerrar(); return; }
  const id = el.dataset.id, act = el.dataset.act;
  switch (act) {
    case "vista": vista = id; try { localStorage.setItem("reorden:vista", id); } catch (x) {} render(); window.scrollTo(0, 0); break;
    case "finv": filtro.inv = id; render(); break;
    case "rep": abrir(id); break;
    case "cerrar": cerrar(); break;
    case "selrop": case "seleoq": sel = +id; render(); break;
    case "prev": case "next": { const i = REP.findIndex((r) => r.n === sel); sel = REP[(i + (act === "next" ? 1 : REP.length - 1)) % REP.length].n; render(); break; }
    case "pedir": pedir(+id); break;
    case "recibir": recibir(id, +el.dataset.n); break;
    case "deshacer": { const i = R.movimientos.map((m) => m.n).lastIndexOf(+id); if (i >= 0) { R.movimientos.splice(i, 1); guardar(); render(); aviso("Se quitó el último registro"); } break; }
    case "exportar": descargar(`registros_reorden_${S.fin}.json`, JSON.stringify({fecha_corte: S.fin, ...R}, null, 1), "application/json"); break;
    case "csv": descargar(`estado_repuestos_${S.fin}.csv`, csv(), "text/csv"); break;
    case "abrir": $("#archivo").click(); break;
    case "copiar": try { navigator.clipboard.writeText(correoHoy()).then(() => aviso("Aviso copiado"), () => aviso("No se pudo copiar: seleccione el texto")); } catch (x) { aviso("No se pudo copiar: seleccione el texto"); } break;
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "f-mov") return;
  e.preventDefault();
  const r = PORN[abierto], tipo = $("#m-tipo").value, q = parseInt($("#m-cant").value, 10), f = $("#m-fecha").value || S.fin, doc = $("#m-doc").value.trim();
  if (!(q >= 0) || (q === 0 && tipo !== "CONTEO")) { aviso("Ingrese una cantidad mayor que cero"); return; }
  if (f < D.meta.inicio) { aviso("La fecha no puede ser anterior al inicio del kárdex (" + fTxt(D.meta.inicio) + ")"); return; }
  if (tipo === "PEDIDO") { pedir(r.n, f); return; }
  if (tipo === "RECEPCION") { const oc = $("#m-oc").value; if (!oc) { aviso("No hay órdenes abiertas para este repuesto"); return; } recibir(oc, r.n, f); return; }
  const k = S.kx[r.n];
  const m = {fecha: f, n: r.n, tipo: tipo === "SALIDA_RES" ? "SALIDA" : tipo, cantidad: q, doc: doc || (tipo === "RESERVA" ? "Alerta amarilla PdM" : tipo === "CONTEO" ? "Conteo físico" : "OT sin número"), de_reserva: tipo === "SALIDA_RES"};
  if (tipo === "RESERVA") m.responsable = "Jefe de Mantenimiento (PdM)";
  const antes = k.posicion;
  agregar(m);
  const k2 = S.kx[r.n], falt = tipo.startsWith("SALIDA") && k2.reqs.length && k2.reqs[k2.reqs.length - 1].faltante;
  aviso(falt ? `Quiebre: faltan ${falt} und; el bus espera la próxima recepción` : k2.posicion <= r.ROP && antes > r.ROP ? `Robot 3: posición ${k2.posicion} ≤ ROP ${r.ROP}. Emita el pedido de ${r.Q} und` : "Movimiento registrado");
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "m-tipo") ajustarForm();
  if (el.dataset.in === "sel") { sel = +el.value; render(); }
  if (el.dataset.in === "kx") { filtro.kx = el.value; render(); }
  if (el.id === "archivo" && el.files[0]) {
    el.files[0].text().then((txt) => {
      const j = JSON.parse(txt);
      if (j.meta && j.repuestos && j.movimientos) { D = j; abierto = null; preparar(); render(); aviso("Datos del " + fTxt(D.meta.fecha_corte) + " cargados"); }
      else if (Array.isArray(j.movimientos)) { R = Object.assign(vacios(), j); delete R.fecha_corte; guardar(); render(); aviso("Registros cargados"); }
      else aviso("El archivo no es datos_punto_reorden.json ni un archivo de registros");
    }).catch(() => aviso("No se pudo leer el archivo: debe ser JSON")).finally(() => (el.value = ""));
  }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.in === "q") { filtro.q = el.value; const pos = el.selectionStart; render(); const n = $("#buscar-rep"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.dataset.in === "spedido") {
    const v = parseFloat(el.value); if (!(v > 0)) return;
    R.costo_pedido = v; guardar();
    if (el.id === "s-rango") $("#s-pedido").value = v; else $("#s-rango").value = Math.min(400, v);
    cuerpoEOQ();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && abierto) cerrar(); });
let _rz; window.addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { if (vista === "rop" || vista === "eoq" || vista === "abc" || abierto) render(); }, 200); });
function csv() {
  const filas = [["n", "repuesto", "clase", "estado", "saldo", "reservado", "en_transito", "posicion", "ROP", "SS", "Q", "stock_max", "EOQ"]];
  for (const r of REP) { const k = S.kx[r.n]; filas.push([r.n, r.nombre, r.clase, ESTADO[S.estados[r.n]][0], k.saldo, k.reservado, k.transito, k.posicion, r.ROP, r.SS, r.Q, r.Smax, eoqDe(r, R.costo_pedido).und]); }
  return "﻿" + filas.map((f) => f.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
}

preparar();
try { const v = localStorage.getItem("reorden:vista"); if (v && VISTAS.some((x) => x[0] === v)) vista = v; } catch (e) {}
render();
</script>
